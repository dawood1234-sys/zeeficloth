<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Zeefi Clothing</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page-shell"><header class="page-heading"><p class="eyebrow">Secure checkout</p><h1>Delivery details</h1></header><form id="checkout-form" class="checkout-grid">
<section class="form-panel"><h2>Shipping address</h2><label>Full name<input name="full_name" required></label><label>Phone<input name="phone" required></label><label>Address<input name="address" required></label><label>City<input name="city" required></label><label>Province<input name="province"></label><label>Postal code<input name="postal_code"></label></section>
<section class="form-panel"><h2>Payment</h2><label>Payment method<select name="payment_method"><option>Cash on Delivery</option><option>Bank Transfer</option></select></label><label>Coupon code<input name="coupon_code"></label><label>Order note<textarea name="notes"></textarea></label><button class="primary-button">Place order</button></section>
</form><div id="confirmation"></div></main><script src="app.js"></script><script>
if(!API.token)location.href="login.html";document.getElementById("checkout-form").onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const {order}=await API.request("/api/checkout",{method:"POST",body:JSON.stringify(data)});document.getElementById("confirmation").innerHTML=`<div class="confirmation"><h2>Order confirmed</h2><p>Your order number is <strong>${order.order_number}</strong>.</p><a href="account.html">View my orders</a></div>`;e.target.remove()}catch(error){alert(error.message)}};</script></body></html>
