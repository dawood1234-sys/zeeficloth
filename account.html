<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account — Zeefi Clothing</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page-shell"><header class="page-heading"><p class="eyebrow">Your account</p><h1>My orders</h1></header><button id="logout" class="text-button">Sign out</button><section id="orders"></section></main>
<script src="app.js"></script><script>if(!API.token)location.href="login.html";document.getElementById("logout").onclick=()=>API.logout();API.request("/api/orders").then(({orders})=>{document.getElementById("orders").innerHTML=orders.length?orders.map(o=>`<article class="order-card"><div><strong>${o.order_number}</strong><p>${new Date(o.created_at).toLocaleDateString()}</p></div><span>${o.status}</span><strong>PKR ${Number(o.total).toLocaleString()}</strong></article>`).join(""):'<p class="empty-state">You have not placed an order yet.</p>'}).catch(error=>alert(error.message));</script><p><a href="profile.html">Edit profile</a> · <a href="wishlist.html">Wishlist</a></p></body></html>
